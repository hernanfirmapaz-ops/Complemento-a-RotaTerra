[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length
    "E741",  # ambiguous variable name (e.g. l for layer)
]

[tool.ruff.lint.isort]
known-first-party = ["geoprocessing", "services", "tests"]

[tool.pytest.ini_options]
testpaths = ["geoprocessing", "services", "tests"]
addopts = "--ignore=tests/e2e/test_sidebar_overflow_playwright.py"
