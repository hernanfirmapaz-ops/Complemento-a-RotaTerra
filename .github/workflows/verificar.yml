name: Verificar

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Tests y Linter (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Caché del programa WhiteboxTools
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python3.12/site-packages/whitebox/WBT
          key: whitebox-bin-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Instalar WhiteboxTools (descarga solo si no está en caché)
        run: python -c "import whitebox; whitebox.WhiteboxTools()"
      - run: ruff check .
      - run: python -m pytest -q

  web:
    name: Build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  visual:
    name: Calidad visual y capturas (Playwright)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - name: Iniciar servidor API
        run: |
          python -m uvicorn services.api.app.main:app --port 8000 &
          sleep 4
      - name: Capturar primera pantalla y verificar bundles
        run: python scripts/verificar_capturas.py --url http://127.0.0.1:8000 --output-dir dist-capturas
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-primera-pantalla
          path: dist-capturas/
